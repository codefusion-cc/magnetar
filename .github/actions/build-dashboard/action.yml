name: Build the dashboard
description: >-
  Node, the workspace's dependencies and apps/web/dist for a Worker deploy or Preview, after a checkout with tags.
  Its version is the one the app has, or gets from the release this commit starts (packages/release/release-version.ts), so the
  website and the app show the same version for the same code; version.json names the commit CI built (GITHUB_SHA).
inputs:
  sha:
    description: The commit whose version to show
    required: true
  version:
    description: >-
      Which version it shows: `display`, the release, or `preview`, Magnetar Preview's build of the same commit
      (v1.2.9-preview.89), so the preview website names the version of the app it offers
    required: false
    default: display
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm
    # Before any step has a Cloudflare token, so install scripts never have it in their environment.
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: VITE_APP_VERSION="$(node packages/release/release-version.ts "$KIND" --sha "$SHA")" pnpm --filter @magnetar/web run build
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
        KIND: ${{ inputs.version }}
