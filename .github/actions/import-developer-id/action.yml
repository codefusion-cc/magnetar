name: Import the Developer ID certificate
description: >-
  Puts the Developer ID certificate into a keychain of the run's own, so package.ts can sign and notarize the macOS app
  (release.yml, preview-app.yml). Does nothing without a certificate: the build is then ad-hoc signed.
inputs:
  certificate:
    description: The .p12 certificate, base64
    required: false
  password:
    description: The certificate's password
    required: false
runs:
  using: composite
  steps:
    - if: inputs.certificate != ''
      shell: bash
      env:
        MACOS_CERTIFICATE: ${{ inputs.certificate }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.password }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        password="$(uuidgen)"
        security create-keychain -p "$password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm "$RUNNER_TEMP/certificate.p12"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
