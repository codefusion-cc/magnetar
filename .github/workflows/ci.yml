name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # aws-lc (rustls' crypto) ships assembled objects for Windows; no NASM install needed.
  AWS_LC_SYS_PREBUILT_NASM: '1'
  # Tests need no debugger symbols: less to compile, link and cache.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    name: Lint, types and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the executable for this runner
        run: npm run build -w @magnetar/client -- --version 0.0.0-ci --profile ci
      - name: Smoke-test the executable
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls apps/client/dist/Magnetar-0.0.0-ci-* | grep -v '\.zip$' | head -1)
          export MAGNETAR_DATA_DIRECTORY="$RUNNER_TEMP/magnetar-smoke" MAGNETAR_PORT=47899 MAGNETAR_NO_TRAY=1 MAGNETAR_NO_BROWSER=1
          "$exe" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:47899/health && break; sleep 1; done
          curl -sf http://localhost:47899/ | grep -q '<div id="root">'
          curl -sf http://localhost:47899/app-config.json | grep -q '"local"'
          cat "$RUNNER_TEMP/smoke.log"
      - name: Exercise the tray icon (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          exe=$(ls apps/client/dist/Magnetar-0.0.0-ci-*.exe | head -1)
          export MAGNETAR_DATA_DIRECTORY="$RUNNER_TEMP/magnetar-tray" MAGNETAR_PORT=47898
          "$exe" > "$RUNNER_TEMP/tray.log" 2>&1 &
          sleep 8
          cat "$RUNNER_TEMP/magnetar-tray"/logs/*.log
          grep -q "Notification-area icon ready" "$RUNNER_TEMP/magnetar-tray"/logs/*.log

  e2e:
    name: Dashboard end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/e2e/test-results

  # Every merge to main that changes the app becomes the next patch release, unless .github/release-hold holds it
  # (release.yml: builds, tags, notes from the merged pull requests). One at a time and never cancelled once started;
  # a merge that lands while one runs waits, and of several waiting only the newest runs, which releases them all.
  # The version is computed inside the run, after the release before it has tagged, so no two releases share a tag.
  release:
    name: Release
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    secrets: inherit

  # Every merge to main goes to staging at preview.magnetar.codefusion.cc once every check above passed, and to
  # production at magnetar.codefusion.cc once the owner approves (deploy-worker.yml: migrations first, each with its
  # own database, relay and secrets). CodeFusion Console reads what runs from each one's version.json, and the
  # outcome of each deploy from its GitHub deployment.
  deploy-staging:
    name: Deploy staging
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: staging
      config: wrangler.preview.jsonc
      origin: https://preview.magnetar.codefusion.cc
    secrets: inherit

  # Waits for the owner's approval (the production-approval environment's required reviewer), which CodeFusion
  # Console gives once staging still serves this very commit. A newer merge replaces the one waiting, so at most one
  # waits, and it is always the commit staging just got. The reviewers sit here rather than on production, whose
  # deploy a newer merge must never cancel.
  approve-production:
    name: Approve production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production-approval
    concurrency:
      group: approve-production
      cancel-in-progress: true
    steps:
      - run: echo "Production deploy of $GITHUB_SHA approved"

  deploy-production:
    name: Deploy production
    needs: [approve-production]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
      config: wrangler.jsonc
      origin: https://magnetar.codefusion.cc
    secrets: inherit

  # Every pull request from this repository gets its own Worker Preview of staging at
  # https://<branch>.preview.magnetar.codefusion.cc, with a database of its own (@codefusion-cc/previews), updated on
  # each push and deleted with its database when the pull request closes (preview-cleanup.yml). Forks get no token.
  # Closing a pull request stops none of its checks: one closed while they ran has had its cleanup already, which a
  # Preview made now would outlive.
  preview-open:
    name: The pull request is still open
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.state.outputs.open }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json state -q .state)
          echo "open=$([ "$state" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$state" = OPEN ] || echo "::notice::#$PR_NUMBER is ${state,,}: no Preview for it"

  preview:
    name: Branch Preview
    needs: [preview-open]
    if: needs.preview-open.outputs.open == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    # One upload per branch at a time; a newer push replaces an older one, and the cleanup (the same group) cancels
    # one under way.
    concurrency:
      group: preview-${{ github.head_ref }}
      cancel-in-progress: true
    env:
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # scripts/release-version.ts reads tags, commits and trees, never file contents.
          filter: blob:none
      - uses: ./.github/actions/build-dashboard
        with:
          sha: ${{ github.event.pull_request.head.sha }}
      # The branch's database (made on its first push, kept after), its migrations, the Preview pointed at it and at
      # its own address, and that address.
      - id: upload
        name: Upload the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The preview environment's CLOUDFLARE_API_TOKEN secret is not set; see docs/DEPLOY.md"
            exit 1
          fi
          name=$(npx --no codefusion-previews up "$HEAD_REF" --config wrangler.preview.jsonc --database-prefix magnetar-previews \
            --set 'https://preview-origin.invalid=https://{name}.preview.magnetar.codefusion.cc' | sed -n 's/^name=//p')
          npx wrangler d1 migrations apply DB --remote -c wrangler.preview-db.generated.jsonc
          npx wrangler preview -c wrangler.preview.generated.jsonc --name "$name" --message "${HEAD_SHA::7} #${PR_NUMBER}"
          npx --no codefusion-previews url "$HEAD_REF" --config wrangler.preview.jsonc --domain preview.magnetar.codefusion.cc >> "$GITHUB_OUTPUT"
