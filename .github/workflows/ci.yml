name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # aws-lc (rustls' crypto) ships assembled objects for Windows; no NASM install needed.
  AWS_LC_SYS_PREBUILT_NASM: '1'
  # Tests need no debugger symbols: less to compile, link and cache.
  CARGO_PROFILE_DEV_DEBUG: '0'

# A new push to a pull request cancels its older run; runs on main, tags and schedules never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux runs on the pool's machine for heavy jobs (vars.CI_RUNNER_HEAVY). macOS and Windows stay on GitHub's machines,
  # free for this public repository, with the Rust client (docs/RUNNERS.md). `check` keeps the job names the ruleset
  # "Protect main" requires, whatever machine runs them; in the monorepo, ci-ok replaces them.
  check:
    name: Lint, types and tests (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: ubuntu-latest, runner: '${{ vars.CI_RUNNER_HEAVY }}' }
          - { check: macos-14, runner: macos-14 }
          - { check: windows-latest, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      # pnpm test builds the released flavour; Magnetar Preview (preview-app.yml) must trust preview-public-key.txt only.
      - name: Magnetar Preview's update key
        if: runner.os == 'macOS'
        env:
          MAGNETAR_PREVIEW: '1'
        run: cargo test --locked -p magnetar --lib config::tests::updates_are_checked_against_this_builds_own_key
      - name: Build the executable for this runner
        run: pnpm --filter @magnetar/client run build --version 0.0.0-ci --profile ci
      - name: Smoke-test the executable
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls apps/client/dist/Magnetar-0.0.0-ci-* | grep -v '\.zip$' | head -1)
          export MAGNETAR_DATA_DIRECTORY="$RUNNER_TEMP/magnetar-smoke" MAGNETAR_PORT=47899 MAGNETAR_NO_TRAY=1 MAGNETAR_NO_BROWSER=1
          "$exe" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:47899/health && break; sleep 1; done
          curl -sf http://localhost:47899/ | grep -q '<div id="root">'
          curl -sf http://localhost:47899/app-config.json | grep -q '"local"'
          cat "$RUNNER_TEMP/smoke.log"
      - name: Exercise the tray icon (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          exe=$(ls apps/client/dist/Magnetar-0.0.0-ci-*.exe | head -1)
          export MAGNETAR_DATA_DIRECTORY="$RUNNER_TEMP/magnetar-tray" MAGNETAR_PORT=47898
          "$exe" > "$RUNNER_TEMP/tray.log" 2>&1 &
          sleep 8
          cat "$RUNNER_TEMP/magnetar-tray"/logs/*.log
          grep -q "Notification-area icon ready" "$RUNNER_TEMP/magnetar-tray"/logs/*.log

  e2e:
    name: Dashboard end to end
    runs-on: ${{ vars.CI_RUNNER_HEAVY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/e2e/test-results

  # Every merge to main that changes the app becomes the next patch release, unless .github/release-hold holds it
  # (release.yml: builds, tags, notes from the merged pull requests). One at a time and never cancelled once started;
  # a merge that lands while one runs waits, and of several waiting only the newest runs, which releases them all.
  # The version is computed inside the run, after the release before it has tagged, so no two releases share a tag.
  release:
    name: Release
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    secrets: inherit

  # Magnetar Preview, main's build for Apple silicon Macs that the preview website offers (preview-app.yml). A build
  # under way finishes; of several merges waiting behind it, only the newest is built.
  preview-app:
    name: Preview app
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: preview-app
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/preview-app.yml
    secrets: inherit

  # Every merge to main goes to the preview Worker at preview.magnetar.codefusion.cc once every check above passed, and to
  # production at magnetar.codefusion.cc once the owner approves (deploy-worker.yml: migrations first, each with its
  # own database, relay and secrets). CodeFusion Console reads what runs from each one's version.json, and the
  # outcome of each deploy from its GitHub deployment. The GitHub environment of the preview Worker is `staging`, whose
  # token deploys it.
  deploy-staging:
    name: Deploy preview
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: staging
      wrangler-env: preview
      origin: https://preview.magnetar.codefusion.cc
    secrets: inherit

  # Waits for the owner's approval (the production-approval environment's required reviewer), which CodeFusion
  # Console gives once the preview Worker still serves this very commit. A newer merge replaces the one waiting, so at
  # most one waits, and it is always the commit the preview Worker just got. The reviewers sit here rather than on production, whose
  # deploy a newer merge must never cancel.
  approve-production:
    name: Approve production
    needs: [deploy-staging]
    runs-on: ${{ vars.CI_RUNNER_LIGHT }}
    environment: production-approval
    concurrency:
      group: approve-production
      cancel-in-progress: true
    steps:
      - run: echo "Production deploy of $GITHUB_SHA approved"

  deploy-production:
    name: Deploy production
    needs: [approve-production]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
      wrangler-env: ''
      origin: https://magnetar.codefusion.cc
    secrets: inherit

  # Every pull request from this repository gets its own Worker Preview of the preview Worker at
  # https://<branch>.preview.magnetar.codefusion.cc, with a database of its own (@codefusion-cc/previews), updated on
  # each push and deleted with its database when the pull request closes (preview-cleanup.yml). Forks get no token.
  # Closing a pull request stops none of its checks: one closed while they ran has had its cleanup already, which a
  # Preview made now would outlive.
  preview-open:
    name: The pull request is still open
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER_LIGHT }}
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.state.outputs.open }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json state -q .state)
          echo "open=$([ "$state" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$state" = OPEN ] || echo "::notice::#$PR_NUMBER is ${state,,}: no Preview for it"

  preview:
    name: Branch Preview
    needs: [preview-open]
    if: needs.preview-open.outputs.open == 'true'
    runs-on: ${{ vars.CI_RUNNER_LIGHT }}
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    # One upload per branch at a time; a newer push replaces an older one, and the cleanup (the same group) cancels
    # one under way.
    concurrency:
      group: preview-${{ github.head_ref }}
      cancel-in-progress: true
    env:
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # packages/release/release-version.ts reads tags, commits and trees, never file contents.
          filter: blob:none
      - uses: ./.github/actions/build-dashboard
        with:
          sha: ${{ github.event.pull_request.head.sha }}
      # The branch's database (made on its first push, kept after), its migrations, the Preview pointed at it and at
      # its own address, and that address. codefusion-previews knows no Wrangler environments: `up` fills in the
      # placeholders of env.preview's `previews` block, and `url` reads the preview Worker's name and account from
      # scripts/preview-worker-config.ts.
      - id: upload
        name: Upload the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The preview environment's CLOUDFLARE_API_TOKEN secret is not set; see docs/DEPLOY.md"
            exit 1
          fi
          name=$(pnpm exec codefusion-previews up "$HEAD_REF" --config wrangler.jsonc --database-prefix magnetar-previews \
            --set 'https://preview-origin.invalid=https://{name}.preview.magnetar.codefusion.cc' | sed -n 's/^name=//p')
          pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.preview-db.generated.jsonc
          pnpm exec wrangler preview -c wrangler.preview.generated.jsonc --env preview --name "$name" --message "${HEAD_SHA::7} #${PR_NUMBER}"
          node scripts/preview-worker-config.ts > "$RUNNER_TEMP/preview-worker.json"
          pnpm exec codefusion-previews url "$HEAD_REF" --config "$RUNNER_TEMP/preview-worker.json" --domain preview.magnetar.codefusion.cc >> "$GITHUB_OUTPUT"
