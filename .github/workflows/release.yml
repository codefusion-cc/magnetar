name: Release

# Every merge to main that changes the app is released as the next patch version (ci.yml calls this workflow once
# its checks pass; packages/release/release-version.ts picks the version and skips docs-, test- and CI-only merges, and every
# merge while .github/release-hold exists).
# A minor or major release is run by hand on main once CI is green there (Actions, Release, Run workflow, version
# 1.3.0); the next automatic patch continues from it. A version with a pre-release (1.3.0-rc.1) publishes a
# pre-release, which installed apps don't take, and never sets the version of the patches after it. Installed apps
# update within 6 hours. Only main builds and signs: the certificates are in the code-signing environment, the release
# key in release-signing, and only main may use either, so a run from any other branch fails.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as 1.3.0
        required: true
  workflow_call:

permissions:
  contents: read

env:
  AWS_LC_SYS_PREBUILT_NASM: '1'

jobs:
  # Runs inside ci.yml's serialized release job, so two merges never pick the same version. The version files are
  # not edited by hand any more: the tag is the version, and the executable and the website take it from there.
  plan:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # A version given by hand must be one above the latest release, never Magnetar Preview's, and a tag that exists
      # only on this commit (release-version.ts checkExplicitTag), before anything is built.
      - id: plan
        env:
          # Given when run by hand; a call from ci.yml computes the version.
          VERSION: ${{ inputs.version }}
        run: node packages/release/release-version.ts plan --sha "$GITHUB_SHA" ${VERSION:+--tag "v${VERSION#v}"}

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          # macOS bundles are signed with codesign, so they build on macOS.
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-14, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          # The oldest supported Ubuntu, so the executable runs on older glibc too.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    # The Apple and Windows certificates, readable only from main; never the release key, which only `sign` holds.
    environment:
      name: code-signing
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The tests run before the certificate is in a keychain. The x64 macOS build is cross-compiled on an arm64
      # runner, so its tests can't run there.
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      # Only when the Developer ID certificate is a secret; without it the build is ad-hoc signed.
      - if: runner.os == 'macOS'
        uses: ./.github/actions/import-developer-id
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-password: ${{ secrets.APPLE_APP_PASSWORD }}
      # Each platform's build, and the crates' build scripts it runs, sees only its own platform's certificate.
      - name: Build
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_PASSWORD || '' }}
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: pnpm --filter @magnetar/client run build --target ${{ matrix.target }} --version "$VERSION"
      - name: Collect the release asset
        shell: bash
        run: |
          mkdir -p out
          cd apps/client/dist
          if ls *.zip >/dev/null 2>&1; then cp *.zip ../../../out/; else cp Magnetar-* ../../../out/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  # Signed apart from the build and the publishing, as Magnetar Preview is: the job that reads the key runs nothing but
  # the repository's own code and Node (no installs, no third-party build scripts), only from main (a pull request's
  # own workflow can't reach release-signing), and before the tag, so a failed signature leaves no tag and the next
  # merge retries the same version.
  sign:
    name: Sign
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment:
      name: release-signing
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd assets && sha256sum Magnetar-* > SHA256SUMS.txt && cd ..
          node packages/release/sign-release.ts assets
      - uses: actions/upload-artifact@v4
        with:
          name: signature
          path: |
            assets/SHA256SUMS.txt
            assets/SHA256SUMS.txt.sig
          if-no-files-found: error

  publish:
    needs: [plan, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The release notes read the merged pull requests' titles and branches.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Only for the release notes' command, before any step has a token.
      - run: pnpm install --frozen-lockfile
      # The tag is made once the builds and the signature succeeded. A run by hand may name a tag that exists already:
      # only on this very commit is it released. (A push with GITHUB_TOKEN starts no other workflow.)
      - name: Tag the commit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tagged="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)"
          if [ -z "$tagged" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$TAG exists"
          else
            echo "::error::$TAG is on $tagged, not $GITHUB_SHA"; exit 1
          fi
      # The builds and the signed manifest.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # What the release brings, from the pull requests merged since the release before, grouped by their branch's
      # type (feat/ New, fix/ Fixes, perf/ Faster…). The app's changelog and its update notice show these notes.
      # A GitHub hiccup here must not lose the release built above: GitHub's own notes stand in.
      - name: Release notes
        id: notes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: pnpm --filter @magnetar/worker exec codefusion-release-notes "$TAG" > notes.md && cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: assets/*
          body_path: ${{ steps.notes.outcome == 'success' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outcome != 'success' }}
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
