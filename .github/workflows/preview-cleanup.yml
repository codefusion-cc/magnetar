name: Preview cleanup

# A pull request's Worker Preview (ci.yml, job "Branch Preview") is deleted with its database and its DeviceRelay
# objects once the pull request is merged or closed. pull_request_target: this file as main has it runs with the
# token, never a pull request's own version of it; it checks out main and runs no code from the pull request.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    name: Delete the branch Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER_LIGHT }}
    # The preview environment's token, without recording a deployment.
    environment:
      name: preview
      deployment: false
    # The branch's upload (ci.yml, the same group) is cancelled before the delete runs, so a Preview still uploading
    # can't outlive its pull request.
    concurrency:
      group: preview-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      # The default branch: a merged pull request's merge ref may already be gone.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # main's dependencies, before any step has the token, so install scripts never see it.
      - run: npm ci
      # The account and Worker come from wrangler.jsonc's env.preview (scripts/preview-worker-config.ts). A branch whose
      # Preview never deployed has neither a Preview nor a database, and that is fine.
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        working-directory: apps/worker
        run: |
          node scripts/preview-worker-config.ts > "$RUNNER_TEMP/preview-worker.json"
          npx --no codefusion-previews down "$HEAD_REF" --config "$RUNNER_TEMP/preview-worker.json" --database-prefix magnetar-previews
