name: Preview app

# Magnetar Preview: every merge to main, built for Apple silicon Macs once its checks pass (ci.yml calls this), whether
# or not .github/release-hold keeps it from a release. It talks to the preview Worker, where the preview website offers
# it (apps/worker/src/releases.ts), and runs beside the released app with its own name, data and links (config.rs
# `PREVIEW`). Published as the pre-release v<next release>-preview.<commit number>, which released apps never take
# and the changelogs leave out; only the newest one is kept. Other systems build from source.
on:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The version counts main's commits and continues from the release tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin-preview
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/import-developer-id
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - id: version
        run: echo "version=$(node packages/release/release-version.ts preview --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          AWS_LC_SYS_PREBUILT_NASM: '1'
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter @magnetar/client run build --target aarch64-apple-darwin --version "$VERSION" --preview
      # The same signed manifest as a release's, so the preview app installs its updates the way the app does.
      - name: Checksums and signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir assets && cp apps/client/dist/*.zip assets/
          cd assets && shasum -a 256 Magnetar-* > SHA256SUMS.txt && cd ..
          node packages/release/sign-release.ts assets
      # The new build first, then the older ones go, so the preview website always has one to offer. A build that finishes
      # after a newer one (the queue below keeps that rare) leaves the newer one standing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          body="$(git log -1 --format=%b "$GITHUB_SHA" | head -1)"
          printf 'Magnetar Preview, built from main at %s: %s\n\nFor trying changes on preview.magnetar.codefusion.cc before they are released. Magnetar itself never updates to it.\n' \
            "${GITHUB_SHA::7}" "${body:-$subject}" > notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title "Magnetar Preview $VERSION" --notes-file notes.md
          fi
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E -- '-preview\.[0-9]+$' | while read -r old; do
            if [ "${old##*.}" -lt "${VERSION##*.}" ]; then gh release delete "$old" --cleanup-tag --yes; fi
          done
