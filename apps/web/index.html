<!doctype html>
<html lang="en">

    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ui/theme.ts sets it to the page background of the theme in use. -->
    <meta name="theme-color" content="#f2ebe1" />

    <title>Magnetar</title>

         answers with this file. apps/web/scripts/guard-preview.ts checks it. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Magnetar" />
    <meta property="og:url" content="https://magnetar.codefusion.cc/" />
    <meta property="og:title" content="Magnetar — Your downloads, from anywhere" />
    <meta property="og:description" content="Search, download and follow series on your own computer from any browser or phone, end-to-end encrypted." />
    <meta property="og:image" content="https://magnetar.codefusion.cc/og-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Magnetar — Your downloads, from anywhere" />
    <meta name="twitter:description" content="Search, download and follow series on your own computer from any browser or phone, end-to-end encrypted." />
    <meta name="twitter:image" content="https://magnetar.codefusion.cc/og-v2.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="no-script">
        <h1>Magnetar</h1>
        <p>Search and download on your computer at home, and look in from anywhere. Magnetar searches six torrent sources
          at once and downloads to the computer it runs on; from a phone or another browser you see the same lists,
          encrypted so that this website cannot read them.</p>
        <p>This page needs JavaScript. The app for macOS, Windows and Linux:
          <a href="https://github.com/codefusion-cc/magnetar/releases/latest">github.com/codefusion-cc/magnetar/releases</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
